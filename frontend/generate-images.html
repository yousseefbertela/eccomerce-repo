<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Product Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #333;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Product Image Generator</h1>
    <p>Click the button below to generate 360 placeholder product images (120 products × 3 images each)</p>
    <button onclick="generateImages()">Generate Images</button>
    <div id="status"></div>
    <canvas id="canvas"></canvas>

    <script>
        function generateImages() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const status = document.getElementById('status');
            
            // Image dimensions (optimized for web)
            canvas.width = 800;
            canvas.height = 1000;
            
            const images = [];
            let count = 0;
            const totalProducts = 120;
            const imagesPerProduct = 3;
            const totalImages = totalProducts * imagesPerProduct;
            
            status.innerHTML = '<p>Generating images...</p>';
            
            for (let i = 1; i <= totalProducts; i++) {
                for (let j = 1; j <= imagesPerProduct; j++) {
                    // Clear canvas
                    ctx.fillStyle = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Add gradient overlay
                    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    gradient.addColorStop(0, 'rgba(0,0,0,0.1)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0.3)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Add product text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 120px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`PROD ${i}`, canvas.width / 2, canvas.height / 2 - 50);
                    
                    // Add image number
                    ctx.font = 'bold 60px Arial';
                    ctx.fillText(`Image ${j}`, canvas.width / 2, canvas.height / 2 + 80);
                    
                    // Convert to data URL and store
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const filename = `product-${i}-${j}.jpg`;
                    
                    images.push({
                        filename: filename,
                        dataUrl: dataUrl
                    });
                    
                    count++;
                }
            }
            
            status.innerHTML = `<p>✅ Generated ${count} images!</p>`;
            status.innerHTML += '<p><strong>Instructions:</strong></p>';
            status.innerHTML += '<ol>';
            status.innerHTML += '<li>Open browser console (F12)</li>';
            status.innerHTML += '<li>Click "Download All Images" button below</li>';
            status.innerHTML += '<li>Images will download automatically</li>';
            status.innerHTML += '<li>Move all images to: <code>frontend/public/assets/images/products/</code></li>';
            status.innerHTML += '</ol>';
            
            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = 'Download All Images';
            downloadBtn.style.marginTop = '20px';
            downloadBtn.onclick = () => downloadImages(images);
            status.appendChild(downloadBtn);
            
            console.log('✅ Images ready! Click "Download All Images" button.');
        }
        
        function downloadImages(images) {
            console.log(`Downloading ${images.length} images...`);
            
            images.forEach((img, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.download = img.filename;
                    link.href = img.dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    if ((index + 1) % 10 === 0) {
                        console.log(`Downloaded ${index + 1}/${images.length} images...`);
                    }
                }, index * 100); // Stagger downloads to avoid browser blocking
            });
            
            alert('Download started! Check your Downloads folder. This may take a few minutes.');
        }
    </script>
</body>
</html>
